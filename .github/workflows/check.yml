name: Check theme

# Called by a theme repository's own check workflow on its pull requests:
#
#   on:
#     pull_request:
#   permissions:
#     id-token: write
#     contents: read
#   jobs:
#     check:
#       uses: emergente-labs/novinzo-theme-deploy/.github/workflows/check.yml@v1
#       with:
#         store: ${{ vars.NOVINZO_STORE }}
#
# What it runs lives here, so it changes with each release of v1 and no theme repository has
# to edit its workflow, which a workflow's own token may not do. It has Novinzo check the
# theme the way a deploy would and deploys nothing. GitHub gives pull requests from forks no
# OIDC token, so they are skipped, as is the starter template, which checks against no store.
on:
  workflow_call:
    inputs:
      store:
        description: The store's subdomain, as the dashboard shows it on Settings → Theme.
        type: string
        required: true
      api-url:
        description: The Novinzo API. Set it only for another Novinzo environment, such as staging.
        type: string
        default: "https://dashboard.novinzo.com/api"
      path:
        description: Where the theme is in the repository.
        type: string
        default: "."
      build:
        description: Run the theme's `npm run build`, installing its dependencies first.
        type: boolean
        default: true

jobs:
  check:
    if: >-
      github.repository != 'emergente-labs/novinzo-theme-starter' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: emergente-labs/novinzo-theme-deploy@v1
        with:
          store: ${{ inputs.store }}
          api-url: ${{ inputs.api-url }}
          path: ${{ inputs.path }}
          build: ${{ inputs.build }}
          mode: check
